name: Daily Coupon Sync

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      date_min:
        description: 'Start date (IST) e.g. 2026-11-12T00:00:00+05:30'
        required: false
        default: ''
      date_max:
        description: 'End date (IST) e.g. 2026-11-12T23:59:59+05:30'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests gspread google-auth google-analytics-data

      - name: Write service account credentials
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Run coupon sync (yesterday's data)
        env:
          TOKEN_API_KEY: ${{ secrets.TOKEN_API_KEY }}
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          ORDERS_CREATED_AT_MIN: ${{ github.event.inputs.date_min }}
          ORDERS_CREATED_AT_MAX: ${{ github.event.inputs.date_max }}
        run: python main.py
