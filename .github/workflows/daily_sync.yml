name: Daily Coupon Sync

on:
  schedule:
    # 8:00 AM IST = 02:30 UTC
    - cron: '30 2 * * *'
  workflow_dispatch:  # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests gspread google-auth google-analytics-data

      - name: Write service account credentials
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Run coupon sync (yesterday's data)
        env:
          TOKEN_API_KEY: ${{ secrets.TOKEN_API_KEY }}
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python main.py
